[package]
# Do not change the name of this crate.
name = "hub"
version = "0.1.0"
edition = "2024"

[lib]
# `lib` is required for non-library targets,
# such as tests and benchmarks.
# `cdylib` is for Linux, Android, Windows, and web.
# `staticlib` is for iOS and macOS.
crate-type = ["lib", "cdylib", "staticlib"]

[lints]
workspace = true

[dependencies]
rinf = "8.9.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util", "process"] }
async-trait = "0.1.87"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
thiserror = "2.0"
serde_json = "1"
tracing = "0.1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 用于把 .torrent 字节编码回 Dart（见 actors/download_actor.rs）
base64 = "0.22"
# 仅 Android/iOS：带 components（仅拉 zip，可交叉编译），不带 plugins（rquickjs-sys 对
# Android/iOS ABI 无预置 bindings，交叉编译必失败）。
fluxdown_engine = { version = "0.1.0", path = "../engine", features = ["components"] }

[target.'cfg(not(windows))'.dependencies]
# 非 Windows 用 rustls（纯 Rust，无系统 TLS 依赖）。native roots 保留本地 CA；
# bundled WebPKI roots 为 Android/iOS 提供公共 CA 兜底，避免空信任库。
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "cookies", "json", "socks", "charset", "http2", "system-proxy", "macos-system-configuration"] }

# Uncomment below to target the web.
# tokio_with_wasm = { version = "0.8.5", features = ["rt", "macros", "time"] }
# wasm-bindgen = "0.2.100"
