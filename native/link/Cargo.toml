[package]
name = "fluxdown_link"
version = "0.1.0"
edition = "2024"
publish = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[dependencies]
async-trait = "0.1.87"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "3.0.0"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
mdns-sd = "0.20.2"
rand = "0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.45.0", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }

# TLS 后端按平台区分（对齐 engine/cli）：Windows 用系统 Schannel（native-tls），
# 其余平台用 rustls，避免 musl 静态交叉编译时找不到系统 OpenSSL。
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
