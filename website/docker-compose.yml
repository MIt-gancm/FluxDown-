# 旧站（v1）：只读存档，挂在 https://fluxdown.zerx.dev/v1/ → 127.0.0.1:4321（保留 /v1 前缀，不要剥掉）。
# 主站是 website-v2/（project=fluxdown-v2，宿主端口 4322，根部署）。
name: fluxdown
services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 站点挂载前缀（构建期固化进产物）；默认 /v1，回到根部署时设 SITE_BASE= 空串
        SITE_BASE: ${SITE_BASE-/v1}
    image: fluxdown-website:latest
    container_name: fluxdown-website
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      # 从 .env 文件读取敏感配置（不提交到 Git）
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - AFDIAN_USER_ID=${AFDIAN_USER_ID}
      - AFDIAN_TOKEN=${AFDIAN_TOKEN}
    env_file:
      - .env
    healthcheck:
      # busybox wget 会先解析 localhost 到 ::1，而 node 只监听 IPv4，必须用 127.0.0.1
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321${SITE_BASE-/v1}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
