# FluxDown Server 部署（fluxdown-agent --server + fluxdownd；Web UI + /rpc JSON-RPC + 兼容 HTTP API）
# 容器由 tini 作 PID 1 启动，沿用旧版同一个 fluxdown-data 卷即可原地升级。
#
# 启动：docker compose up -d
# 首次访问 http://<宿主机>:17800/ 会进入初始化向导，自行设置访问密钥
# （至少 8 位，必须同时包含字母和数字）。无人值守部署可用 FLUXDOWN_TOKEN 预置。
# 首次设置完成前 /download、/download/batch 与 /jsonrpc（POST / WS）返回 403，
# 不允许匿名接管或 aria2 RPC；Web 初始化页面与 setup 引导接口仍可访问。
services:
  fluxdown-server:
    image: ghcr.io/zerx-lab/fluxdown-server:latest
    # 本地构建（替代 image 一行）：
    # build:
    #   context: ..
    #   dockerfile: docker/server.Dockerfile
    container_name: fluxdown-server
    restart: unless-stopped
    ports:
      - "17800:17800"
    volumes:
      # NAS 硬盘休眠：/data 会承载 SQLite、日志与 BT 会话状态，建议映射到 SSD / 缓存池
      # （如 Unraid appdata 放 cache），不要与需要休眠的机械盘阵列放在一起。
      - fluxdown-data:/data # DB / 日志 / 访问密钥
      - ./downloads:/root/Downloads # 默认下载目录（容器内 HOME=/root）
    # environment:
    #   FLUXDOWN_TOKEN: ChangeMe2026 # 预置访问密钥，跳过 Web 初始化向导；仅在尚未设置过密钥时生效
    #   FLUXDOWN_LANG: zh # Web 界面默认语言（en/zh）；用户手动改过语言后以手动选择为准
    #   FLUXDOWN_DEMO: "1" # 演示模式：仅允许下载内置演示文件
    #   FLUXDOWN_DATABASE_URL: postgres://user:pass@host:5432/fluxdown # 外部数据库
    # 镜像内置 30s 一次的 /ping 健康检查；若 Docker 数据目录位于需要休眠的机械盘，
    # 可按需关闭：
    # healthcheck:
    #   disable: true

volumes:
  fluxdown-data:
